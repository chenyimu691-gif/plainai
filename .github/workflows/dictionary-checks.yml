name: Dictionary checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictionary-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Dictionary quality and extension build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dictionary:verify
      - run: npm run compile
      - run: npm run build
      - run: node scripts/verify.cjs
      - run: npm run build:firefox
